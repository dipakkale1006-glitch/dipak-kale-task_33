# Render blueprint for the To-Do List API.
#
# Commit this file to the repository root or to the `backend` folder and Render
# can create the service from it ("New" -> "Blueprint").
#
# Remember to set MONGODB_URI and CORS_ORIGIN in the Render dashboard
# (or uncomment the envVars block below and supply the values).

services:
  - type: web
    name: todo-list-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Set these in the dashboard (marked sync:false so they are not stored here).
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        value: https://harmonious-moonbeam-e46a8a.netlify.app
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 300
